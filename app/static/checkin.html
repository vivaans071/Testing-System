<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asset Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css?v=29" />
</head>
<body>
<div class="checkin-wrap" id="root">
  <div class="status"><div class="spinner"></div></div>
  <div class="sub">Loading&hellip;</div>
</div>
<div id="modalRoot"></div>
<script>
const CODE = location.pathname.split("/").filter(Boolean).pop();
const root = document.getElementById("root");
let STATUSES = [];
let CURRENT_STATUS = null;
let ASSET_NAME = "";
let ME_EMAIL = "";
let DEPARTMENTS = null;
function render(html) { root.innerHTML = html; }
function escapeHtml(s) { return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function renderError(msg) {
  render(`<div class="status">&#9888;&#65039;</div><h1>Couldn't load</h1><div class="sub">${msg}</div>`);
}
function qualifiedNote(value) {
  const el = document.getElementById("qualNote");
  if (el) el.style.display = value === "Qualified" ? "" : "none";
}
function statusOptions(current) {
  const options = STATUSES.slice();
  if (current && !options.includes(current)) options.unshift(current);
  return options.map(s => `<option value="${s}" ${s === current ? "selected" : ""}>${s}</option>`).join("");
}

/* ------------------------------------------------------- check-out / custody */
function custodySection(info) {
  if (info.checked_out) {
    const who = info.holder_person
      ? `${escapeHtml(info.holder_person)} (${escapeHtml(info.holder_department || "?")})`
      : escapeHtml(info.holder_department || "?");
    const due = info.due_back ? ` &middot; due back ${new Date(info.due_back).toLocaleDateString()}` : "";
    return `<div class="qr-custody-line">
      <div>Checked out to <b>${who}</b>${due}</div>
      <button class="btn small" onclick="doCheckinCustody()">Check in (returned)</button>
    </div>`;
  }
  return `<button class="btn" onclick="openCheckoutDialog()">Check out</button>`;
}
async function loadDepartments() {
  if (DEPARTMENTS) return DEPARTMENTS;
  try {
    const r = await fetch("/api/departments");
    if (!r.ok) throw new Error();
    DEPARTMENTS = await r.json();
  } catch (e) { DEPARTMENTS = []; }
  return DEPARTMENTS;
}
function showModal(html) { document.getElementById("modalRoot").innerHTML = html; }
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
async function openCheckoutDialog() {
  const depts = await loadDepartments();
  const deptOpts = depts.map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join("");
  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:420px">
        <header><h3>Check out</h3><button class="x" onclick="closeModal()">&times;</button></header>
        <div class="body">
          <label class="f"><span>Borrowing department *</span>
            <select id="co_dept"><option value="">Select\u2026</option>${deptOpts}</select></label>
          <label class="f"><span>Person</span>
            <input id="co_person" value="${escapeHtml(ME_EMAIL)}" placeholder="e.g. Jordan Lee" autocomplete="off" /></label>
          <label class="f"><span>Expected back</span>
            <input id="co_due" type="date" /></label>
          <label class="f"><span>Note</span>
            <input id="co_note" placeholder="what it's for" autocomplete="off" /></label>
          <div id="co_err" class="help" style="color:var(--red)"></div>
        </div>
        <footer>
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn primary" id="co_submit" onclick="doCheckoutSubmit()">Check out</button>
        </footer>
      </div>
    </div>`);
}
async function doCheckoutSubmit() {
  const err = document.getElementById("co_err"); err.textContent = "";
  const dept = document.getElementById("co_dept").value;
  if (!dept) { err.textContent = "Pick a borrowing department."; return; }
  const btn = document.getElementById("co_submit");
  btn.disabled = true; btn.textContent = "Checking out\u2026";
  try {
    const r = await fetch(`/api/public/checkout/${CODE}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        department_id: Number(dept),
        person: document.getElementById("co_person").value,
        due_back: document.getElementById("co_due").value || null,
        note: document.getElementById("co_note").value,
      }),
    });
    if (!r.ok) { let m = "Check-out failed."; try { m = (await r.json()).detail || m; } catch (e) {} throw new Error(m); }
    closeModal();
    await refreshAsset();
  } catch (e) {
    btn.disabled = false; btn.textContent = "Check out";
    err.textContent = e.message || "Couldn't reach the server.";
  }
}
async function doCheckinCustody() {
  try {
    const r = await fetch(`/api/public/checkin_custody/${CODE}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({}),
    });
    if (!r.ok) throw new Error();
    await refreshAsset();
  } catch (e) {
    alert("Couldn't reach the server. Check your connection and try again.");
  }
}
async function refreshAsset() {
  try {
    const r = await fetch(`/api/public/asset/${CODE}`);
    if (!r.ok) throw new Error();
    const info = await r.json();
    STATUSES = info.statuses; CURRENT_STATUS = info.status; ASSET_NAME = info.name;
    renderReady(info);
  } catch (e) { /* leave the current view showing rather than blank it */ }
}

/* ------------------------------------------------------------- item details */
function detailRow(label, value) {
  return `<div class="row2"><span>${escapeHtml(label)}</span><span>${escapeHtml(value || "\u2013")}</span></div>`;
}
function detailsPanel(info) {
  return `<div id="itemDetails" class="item-details" style="display:none">
    ${detailRow("Department", info.department)}
    ${detailRow("Owner", info.owner)}
    ${detailRow("Status", info.status)}
    ${detailRow("Location", info.location)}
    ${detailRow("Vendor", info.vendor)}
    ${detailRow("Serial number", info.serial_number)}
    ${detailRow("Asset code", info.asset_code)}
  </div>`;
}
function toggleDetails() {
  const el = document.getElementById("itemDetails");
  const btn = document.getElementById("detailsBtn");
  if (!el) return;
  const open = el.style.display !== "none";
  el.style.display = open ? "none" : "";
  if (btn) btn.textContent = open ? "View item details" : "Hide item details";
}

/* ------------------------------------------------------------------ main page */
function renderReady(info) {
  const lastKnown = info.last_checkin
    ? new Date(info.last_checkin).toLocaleString() + (info.last_checked_in_by ? ` by ${escapeHtml(info.last_checked_in_by)}` : "")
    : null;
  render(`
    <h1>${escapeHtml(info.name)}</h1>
    <div class="sub">Current status: <b>${escapeHtml(info.status)}</b>${info.status_note ? ` &mdash; ${escapeHtml(info.status_note)}` : ""}</div>
    ${lastKnown ? `<div class="help" style="margin-bottom:14px">Previously checked in: ${lastKnown}</div>` : ""}
    <div class="qr-actions">
      ${custodySection(info)}
      <button class="btn" id="detailsBtn" onclick="toggleDetails()">View item details</button>
      ${detailsPanel(info)}
    </div>
    <div class="checkin-card">
      <div class="f">
        <label><span>Status update</span>
          <select id="statusSel" style="width:100%" onchange="qualifiedNote(this.value)">${statusOptions(CURRENT_STATUS)}</select>
          <div id="qualNote" class="qual-note" style="display:none">
            <b>Qualified</b> means the product is READY to be put into its intended use.</div></label>
      </div>
      <div class="f">
        <label><span>Note</span>
          <textarea id="note" rows="3"></textarea></label>
      </div>
      <button class="btn primary" id="checkinBtn" style="width:100%;padding:14px;font-size:16px" onclick="doCheckIn()">Check In</button>
      <div id="checkinErr" class="help" style="margin-top:8px;color:var(--red)"></div>
    </div>
  `);
}
function renderDone(ts) {
  const time = new Date(ts).toLocaleString();
  render(`
    <div class="status">&#9989;</div>
    <h1>Checked in!</h1>
    <div class="sub confirm">${escapeHtml(ASSET_NAME)} &mdash; ${time}</div>
  `);
}
function getLocation(timeoutMs) {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    const timer = setTimeout(() => resolve(null), timeoutMs);
    navigator.geolocation.getCurrentPosition(
      (pos) => { clearTimeout(timer); resolve(pos.coords); },
      () => { clearTimeout(timer); resolve(null); },
      { timeout: timeoutMs, maximumAge: 60000 }
    );
  });
}
async function doCheckIn() {
  const btn = document.getElementById("checkinBtn");
  const err = document.getElementById("checkinErr");
  const note = document.getElementById("note").value;
  const status = document.getElementById("statusSel").value;
  btn.disabled = true; btn.textContent = "Checking in\u2026"; err.textContent = "";
  const coords = await getLocation(4000);
  try {
    const r = await fetch(`/api/public/checkin/${CODE}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        note: note,
        lat: coords ? coords.latitude : null,
        lon: coords ? coords.longitude : null,
        accuracy_m: coords ? coords.accuracy : null,
      }),
    });
    if (!r.ok) throw new Error();
    const result = await r.json();
    const update = await fetch(`/api/public/checkin/${CODE}/${result.checkin_id}`, {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ note: note, status: status, status_note: note }),
    });
    if (!update.ok) throw new Error();
    renderDone(result.ts);
  } catch (e) {
    btn.disabled = false; btn.textContent = "Check In";
    err.textContent = "Couldn't reach the server. Check your connection and try again.";
  }
}
async function run() {
  if (!CODE) return renderError("No asset code found in this link.");
  try {
    const r = await fetch(`/api/public/asset/${CODE}`);
    if (!r.ok) throw new Error();
    const info = await r.json();
    STATUSES = info.statuses; CURRENT_STATUS = info.status; ASSET_NAME = info.name;
    // Best-effort: if this phone has an active company session, Easy Auth
    // lets us prefill "Person" on the check-out dialog with their email.
    // Never blocks the page - a rejected/failed call just leaves it blank.
    fetch(`/api/auth/me`).then(r => r.ok ? r.json() : null)
      .then(me => { if (me && me.email) ME_EMAIL = me.email; })
      .catch(() => {});
    renderReady(info);
  } catch (e) {
    renderError("This QR code doesn't match any known asset. Ask an admin to check it.");
  }
}
run();
</script>
</body>
</html>
