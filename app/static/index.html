<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asset Check-In — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css?v=29" />
<style>
  /* Settings dropdown menu - added inline so style.css doesn't need to change */
  .settings-menu { position: relative; display: inline-block; }
  .settings-panel {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 40;
    background: #fff; border: 1px solid #dde2e7; border-radius: 10px;
    box-shadow: 0 12px 30px rgba(11,31,58,.18); min-width: 190px; padding: 6px;
  }
  .settings-panel button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 9px 12px; border-radius: 7px; cursor: pointer; color: #16233a; font-size: 13.5px;
  }
  .settings-panel button:hover { background: #e7f0fc; color: #0b1f3a; }
  .settings-sep { height: 1px; background: #eef0f2; margin: 5px 2px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const API = "/api";
let ADMIN_TOKEN = localStorage.getItem("checkin_admin_token");
let IS_ADMIN = false;
let ME = null;
let ASSETS = [];
let DEPARTMENTS = [];
let OWNERS = [];
let STATUSES = [];
let BASE_URL = "";
let COMPANY_NAME = "";
// Department grouping is the default view everyone lands on. Changing the
// dropdown still overrides it for the rest of the session.
let GROUP_BY = "department";
let SORT_BY = "";
let SEARCH = "";
let PAGE = "dashboard"; // "dashboard" | "scan"

// Classes and locations are admin-editable lists loaded from the API at
// startup (Settings -> Classes / Locations). They were hardcoded here before;
// the same defaults are now seeded server-side on first run.
let CLASSES = [];
const DEFAULT_CLASS = "Not R&D / Production";

let LOCATIONS = [];      // flat list of names, for the asset-form dropdown
let LOCATION_TREE = [];  // nested parent/child, for the editor
let LOCATION_FLAT = [];  // [{id, name, parent_id}]

// What kind of thing it is. Picks the expense account when cost <= $2500:
// Computer -> 6710, Test & Char -> 6184, Other lab -> 6180. Over $2500 it is
// capitalised as 1520 regardless, so this only matters for cheaper items.

const ACT_SEEN_KEY = "checkin_activity_seen";  // per-device "last seen" marker
let ACT_POLL = null;
let SETTINGS = {};

let IMPORT = {};
const IMPORT_FIELDS = ["name","asset_code","asset_class","department","owner","vendor",
  "location","cost","serial_number","date_purchased","status","notes"];
const IMPORT_FIELD_LABELS = {
  name:"Name *", asset_code:"Asset Code", asset_class:"Class", department:"Department",
  owner:"Owner", vendor:"Vendor", location:"Location", cost:"Cost",
  serial_number:"Serial number", date_purchased:"Date purchased", status:"Status", notes:"Notes" };

/* ---------------------------------------------------------------- api */
async function api(path, opts = {}) {
  const headers = opts.headers || {};
  if (ADMIN_TOKEN) headers["X-Admin-Token"] = ADMIN_TOKEN;
  if (opts.body) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.body); }
  const res = await fetch(API + path, { ...opts, headers });
  if (!res.ok) { let m = res.statusText; try { m = (await res.json()).detail || m; } catch (e) {} throw new Error(m); }
  return res.status === 204 ? null : res.json();
}
function escapeHtml(s) { return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function download(path, filename) {
  const res = await fetch(API + path, { headers: ADMIN_TOKEN ? { "X-Admin-Token": ADMIN_TOKEN } : {} });
  if (!res.ok) throw new Error("Download failed");
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
// Export to Excel opens a department picker first. The sheet comes back
// grouped, with a bold banner row per department.
function exportExcel() {
  const rows = DEPARTMENTS.map(d => `
    <label class="row" style="gap:8px;align-items:center;padding:4px 0">
      <input type="checkbox" class="expDept" value="${d.id}" checked />
      <span>${escapeHtml(d.name)}</span>
      <span class="help">${d.asset_count ?? ""}</span></label>`).join("");
  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:420px">
        <header><h3>Export to Excel</h3><button class="x" onclick="closeModal()">&times;</button></header>
        <div class="body">
          <div class="help" style="margin-bottom:10px">Pick which departments to include. The sheet is
            grouped by department, each under a bold heading.</div>
          <div class="row" style="gap:10px;margin-bottom:8px">
            <button class="btn small" onclick="expDeptAll(true)">Select all</button>
            <button class="btn small" onclick="expDeptAll(false)">Clear</button>
          </div>
          <div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px">
            ${rows || `<div class="empty">No departments yet.</div>`}
            <label class="row" style="gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line-soft);margin-top:6px;padding-top:8px">
              <input type="checkbox" class="expDept" value="none" checked />
              <span>(No department)</span></label>
          </div>
          ${SEARCH ? `<div class="help" style="margin-top:8px">Your current search
            &ldquo;${escapeHtml(SEARCH)}&rdquo; also applies.</div>` : ""}
          <div id="expErr" class="help" style="color:var(--red);margin-top:8px"></div>
        </div>
        <footer>
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn primary" onclick="runExportExcel()">Export</button>
        </footer>
      </div>
    </div>`);
}
function expDeptAll(on) {
  document.querySelectorAll(".expDept").forEach(c => { c.checked = on; });
}
function runExportExcel() {
  const ids = [...document.querySelectorAll(".expDept:checked")].map(c => c.value);
  const err = document.getElementById("expErr");
  if (!ids.length) { err.textContent = "Pick at least one department."; return; }
  const params = [];
  if (SEARCH) params.push(`q=${encodeURIComponent(SEARCH)}`);
  // Only send the filter when it isn't "everything", so a full export keeps
  // working even if the department list changes between load and click.
  const total = DEPARTMENTS.length + 1;
  if (ids.length < total) params.push(`department_ids=${ids.join(",")}`);
  const qs = params.length ? "?" + params.join("&") : "";
  closeModal();
  download("/assets/export.xlsx" + qs, "assets.xlsx").catch(e => alert(e.message));
}
function exportToPrint(ids) {
  if (!ids || !ids.length) return;
  download(`/assets/export-print.xlsx?ids=${ids.join(",")}`, "export_to_print.xlsx")
    .catch(e => alert(e.message));
}

/* ----------------------------------------------------- import from excel */
async function apiForm(path, formData) {
  const headers = {};
  if (ADMIN_TOKEN) headers["X-Admin-Token"] = ADMIN_TOKEN;
  const res = await fetch(API + path, { method: "POST", headers, body: formData });
  if (!res.ok) { let m = res.statusText; try { m = (await res.json()).detail || m; } catch (e) {} throw new Error(m); }
  return res.json();
}

function guessColumn(field, columns) {
  const aliases = {
    name:["description","name","asset name","item"], asset_code:["asset codes","asset code","code","tag"],
    asset_class:["class"], department:["department","dept"], owner:["owner","assigned to","assigned"],
    vendor:["vendor","manufacturer","supplier","make"], location:["location","site","room"],
    cost:["amount ($)","amount","cost","price","value"], serial_number:["serial number","serial","s/n"],
    date_purchased:["purchase date","date purchased","purchased","acquired","po date"],
    status:["status"], notes:["notes","note","comment","comments"] };
  const lc = columns.map(c => c.toLowerCase());
  const cands = aliases[field] || [field.replace("_", " ")];
  for (const a of cands) { const i = lc.indexOf(a); if (i >= 0) return columns[i]; }
  for (const a of cands) { const i = lc.findIndex(c => c.includes(a)); if (i >= 0) return columns[i]; }
  return "";
}

function openImport() {
  IMPORT = { file: null, sheet: "", headerRow: 1, columns: [], sheets: [], mapping: {} };
  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:560px">
        <header><h3>Import from Excel</h3><button class="x" onclick="closeModal()">&times;</button></header>
        <div class="body">
          <div class="f"><label><span>Excel file (.xlsx)</span>
            <input type="file" id="impFile" accept=".xlsx" /></label></div>
          <div class="f" style="max-width:220px"><label><span>Which row has the column titles?</span>
            <input type="number" id="impHeaderRow" min="1" value="1" /></label></div>
          <div class="help">Everything above that row (titles, notes) is ignored. Most sheets use row 1.</div>
          <div id="impErr" class="help" style="color:var(--red)"></div>
        </div>
        <footer>
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn primary" onclick="importInspect()">Load file &rarr;</button>
        </footer>
      </div>
    </div>`);
}

async function importInspect() {
  const fileEl = document.getElementById("impFile");
  const err = document.getElementById("impErr"); err.textContent = "";
  if (!fileEl.files.length) { err.textContent = "Choose a .xlsx file first."; return; }
  IMPORT.file = fileEl.files[0];
  IMPORT.headerRow = Number(document.getElementById("impHeaderRow").value) || 1;
  await runInspect(err);
}

async function runInspect(errEl) {
  const fd = new FormData();
  fd.append("file", IMPORT.file);
  fd.append("header_row", IMPORT.headerRow);
  fd.append("sheet", IMPORT.sheet || "");
  try {
    const info = await apiForm("/import/inspect", fd);
    IMPORT.sheets = info.sheets; IMPORT.sheet = info.sheet;
    IMPORT.columns = info.columns; IMPORT.dataRows = info.data_rows;
    IMPORT.headerRow = info.header_row;
    renderImportMap(info);
  } catch (e) { if (errEl) errEl.textContent = e.message; }
}

async function reInspect() {
  const sheetEl = document.getElementById("impSheet");
  const hrEl = document.getElementById("impHeaderRow2");
  if (sheetEl) IMPORT.sheet = sheetEl.value;
  if (hrEl) IMPORT.headerRow = Number(hrEl.value) || 1;
  await runInspect(document.getElementById("impErr"));
}

function renderImportMap(info) {
  const sheetPicker = info.sheets.length > 1 ? `
    <label class="row" style="gap:6px"><span class="help">Sheet</span>
      <select id="impSheet" onchange="reInspect()">${info.sheets.map(s =>
        `<option ${s === info.sheet ? "selected" : ""}>${escapeHtml(s)}</option>`).join("")}</select></label>` : "";
  const colOpts = sel => `<option value="">— skip —</option>` + info.columns.map(c =>
    `<option value="${escapeHtml(c)}" ${c === sel ? "selected" : ""}>${escapeHtml(c)}</option>`).join("");
  const rows = IMPORT_FIELDS.map(f => {
    const sel = (IMPORT.mapping && IMPORT.mapping[f]) || guessColumn(f, info.columns);
    return `<tr><td style="white-space:nowrap;font-weight:600">${IMPORT_FIELD_LABELS[f]}</td>
      <td><select id="map_${f}" style="width:100%">${colOpts(sel)}</select></td></tr>`;
  }).join("");
  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:640px">
        <header><h3>Import from Excel — map columns</h3><button class="x" onclick="closeModal()">&times;</button></header>
        <div class="body">
          <div class="row" style="justify-content:space-between;align-items:center">
            <div class="row" style="gap:14px">${sheetPicker}
              <label class="row" style="gap:6px"><span class="help">Header row</span>
                <input type="number" id="impHeaderRow2" min="1" value="${info.header_row}" style="width:70px" onchange="reInspect()"/></label></div>
            <span class="help">${info.data_rows} rows below the header</span>
          </div>
          <div class="help" style="margin:12px 0 2px">Match each field to a column in your sheet. Leave anything you don't need on "— skip —". Only <b>Name</b> is required.</div>
          <div class="tablewrap"><table><thead><tr><th>Field</th><th>Spreadsheet column</th></tr></thead>
            <tbody>${rows}</tbody></table></div>
          <div id="impErr" class="help" style="color:var(--red);margin-top:8px"></div>
        </div>
        <footer>
          <button class="btn" onclick="openImport()">&larr; Back</button>
          <span style="flex:1"></span>
          <button class="btn primary" onclick="importPreview()">Preview &rarr;</button>
        </footer>
      </div>
    </div>`);
}

function collectMapping() {
  const m = {};
  IMPORT_FIELDS.forEach(f => { const el = document.getElementById("map_" + f); if (el && el.value) m[f] = el.value; });
  return m;
}

async function importPreview() {
  const err = document.getElementById("impErr"); err.textContent = "";
  const m = collectMapping();
  if (!m.name) { err.textContent = "Map a column to Name — it's the only required field."; return; }
  IMPORT.mapping = m;
  const fd = new FormData();
  fd.append("file", IMPORT.file); fd.append("header_row", IMPORT.headerRow);
  fd.append("sheet", IMPORT.sheet || ""); fd.append("mapping", JSON.stringify(m));
  try { renderImportPreview(await apiForm("/import/preview", fd)); }
  catch (e) { err.textContent = e.message; }
}

function renderImportPreview(p) {
  const warn = p.warning_count > 0 ? `
    <details class="import-warn"><summary>${p.warning_count} row${p.warning_count === 1 ? "" : "s"} have missing or unreadable fields — they'll still import, with those fields left blank</summary>
      <div class="import-warn-list">${p.warnings.map(w =>
        `<div><b>Row ${w.row}:</b> ${w.messages.map(escapeHtml).join("; ")}</div>`).join("")}</div>
    </details>` : `<div class="help" style="color:var(--green)">No field problems detected.</div>`;
  const prev = p.preview.map(r => `<tr>
    <td>${escapeHtml(r.name || "")}</td><td>${escapeHtml(r.asset_code || "")}</td>
    <td>${escapeHtml(r.asset_class || "")}</td><td>${escapeHtml(r.owner || "")}</td>
    <td>${escapeHtml(r.vendor || "")}</td><td>${r.cost ?? ""}</td>
    <td>${escapeHtml(r.date_purchased || "")}</td><td>${escapeHtml(r.status || "")}</td></tr>`).join("");
  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:720px">
        <header><h3>Import from Excel — review</h3><button class="x" onclick="closeModal()">&times;</button></header>
        <div class="body">
          <div class="import-summary">
            <div><span class="import-big">${p.will_import}</span>assets will be created</div>
            <div class="help">${p.skipped_blank} empty/banner row${p.skipped_blank === 1 ? "" : "s"} skipped
              ${p.skipped_duplicate_code ? ` · ${p.skipped_duplicate_code} skipped (asset code already exists)` : ""}
              · ${p.total_rows} rows scanned</div>
          </div>
          ${warn}
          <div class="help" style="margin:14px 0 4px">Preview (first ${p.preview.length}):</div>
          <div class="tablewrap"><table><thead><tr><th>Name</th><th>Asset Code</th><th>Class</th><th>Owner</th><th>Vendor</th><th>Cost</th><th>Purchased</th><th>Status</th></tr></thead>
            <tbody>${prev}</tbody></table></div>
          <div id="impErr" class="help" style="color:var(--red);margin-top:8px"></div>
        </div>
        <footer>
          <button class="btn" onclick="reInspect()">&larr; Back</button>
          <span style="flex:1"></span>
          <button class="btn primary" onclick="importCommit()">Import ${p.will_import} assets</button>
        </footer>
      </div>
    </div>`);
}

async function importCommit() {
  showModal(`<div class="overlay"><div class="modal" style="width:420px"><div class="body">
    <div class="empty"><div class="spinner"></div><div style="margin-top:10px">Importing…</div></div></div></div></div>`);
  const fd = new FormData();
  fd.append("file", IMPORT.file); fd.append("header_row", IMPORT.headerRow);
  fd.append("sheet", IMPORT.sheet || ""); fd.append("mapping", JSON.stringify(IMPORT.mapping));
  try {
    const res = await apiForm("/import/commit", fd);
    await loadAssets(); updateActivityBadge();
    showModal(`
      <div class="overlay" onclick="if(event.target===this){closeModal();renderDashboard();}">
        <div class="modal" style="width:440px">
          <div class="body" style="text-align:center">
            <div style="font-size:42px">&#9989;</div>
            <h3 style="margin:6px 0">Imported!</h3>
            <div><b>${res.created}</b> assets created.</div>
            <div class="help" style="margin-top:6px">${res.skipped_blank} empty rows skipped
              ${res.skipped_duplicate_code ? ` · ${res.skipped_duplicate_code} skipped (asset code already exists)` : ""}
              · ${res.warning_count} imported with some blank fields.</div>
          </div>
          <footer><span style="flex:1"></span><button class="btn primary" onclick="closeModal(); renderDashboard();">Done</button></footer>
        </div>
      </div>`);
  } catch (e) {
    showModal(`
      <div class="overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal" style="width:440px">
          <div class="body"><div class="status" style="font-size:32px">&#9888;&#65039;</div>
            <h3>Import failed</h3><div class="help" style="color:var(--red)">${escapeHtml(e.message)}</div>
            <div class="help" style="margin-top:6px">Nothing was saved. You can adjust the mapping and try again.</div></div>
          <footer><button class="btn" onclick="closeModal()">Close</button>
            <button class="btn primary" onclick="reInspect()">Back to mapping</button></footer>
        </div>
      </div>`);
  }
}

/* --------------------------------------------------------- settings menu */
function toggleSettingsMenu(e) {
  e.stopPropagation();
  const panel = document.getElementById("settingsPanel");
  if (!panel) return;
  panel.style.display = panel.style.display === "none" ? "block" : "none";
}
function closeSettingsMenu() {
  const panel = document.getElementById("settingsPanel");
  if (panel) panel.style.display = "none";
}
document.addEventListener("click", () => closeSettingsMenu());

/* ------------------------------------------------------------ bootstrap */
async function renderApp() {
  // No login screen: identity comes from the company login (Easy Auth) via a
  // request header the server reads. We just ask the server who we are.
  try { ME = await api("/auth/me"); } catch (e) { ME = { full_name: "Guest", authenticated: false }; }
  try { const st = await api("/auth/admin-status"); IS_ADMIN = st.is_admin; } catch (e) { IS_ADMIN = false; }
  const [settings, depts, owners, locs, classes] = await Promise.all([
    api("/settings"), api("/departments"), api("/owners"),
    api("/locations"), api("/classes")]);
  SETTINGS = settings;
  BASE_URL = settings.base_url; COMPANY_NAME = settings.company_name;
  STATUSES = settings.statuses; DEPARTMENTS = depts; OWNERS = owners;
  LOCATION_TREE = locs.tree || []; LOCATION_FLAT = locs.flat || [];
  LOCATIONS = LOCATION_FLAT.map(l => l.name);
  CLASSES = classes.map(c => c.name);
  await loadAssets();
  renderCurrentPage();
  updateActivityBadge();
  refreshReminderBadge();
  if (!ACT_POLL) ACT_POLL = setInterval(() => { updateActivityBadge(); refreshReminderBadge(); }, 60000);
}

async function updateActivityBadge() {
  const badge = document.getElementById("actBadge");
  if (!badge) return;
  try {
    const since = localStorage.getItem(ACT_SEEN_KEY) || "";
    const r = await api(`/activity/unread?since=${encodeURIComponent(since)}`);
    if (r.count > 0) { badge.textContent = r.count > 99 ? "99+" : r.count; badge.style.display = ""; }
    else { badge.style.display = "none"; }
  } catch (e) { /* stay quiet — badge is non-critical */ }
}

async function renderCurrentPage() {
  // Awaited: renderActivity() clears the seen marker as part of loading, and
  // firing updateActivityBadge() alongside it would race - the stale request
  // can land last and repaint the count over an already-cleared badge.
  if (PAGE === "scan") renderScan();
  else if (PAGE === "activity") { await renderActivity(); return; }
  else if (PAGE === "analytics") renderAnalytics();
  else renderDashboard();
  updateActivityBadge();
  refreshReminderBadge();
}

/* Admin gate: entering the admin password gets a token stored per-browser.
   can() replaces the old role check - true only after an admin login. */
function can() { return IS_ADMIN; }

async function adminLogin() {
  const pw = document.getElementById("adminPw").value;
  const err = document.getElementById("adminErr");
  err.textContent = "";
  try {
    const r = await api("/auth/admin-login", { method: "POST", body: { password: pw } });
    ADMIN_TOKEN = r.admin_token;
    localStorage.setItem("checkin_admin_token", ADMIN_TOKEN);
    IS_ADMIN = true;
    closeModal();
    renderApp();
  } catch (e) { err.textContent = e.message; }
}

function adminLogout() {
  ADMIN_TOKEN = null; IS_ADMIN = false;
  localStorage.removeItem("checkin_admin_token");
  renderApp();
}

/* ------------------------------------------------------------ dashboard */
async function loadAssets() {
  const q = SEARCH ? `?q=${encodeURIComponent(SEARCH)}` : "";
  ASSETS = await api("/assets" + q);
}

function fmtAgo(ts) {
  if (!ts) return null;
  const mins = (Date.now() - new Date(ts + "Z").getTime()) / 60000;
  if (mins < 60) return `${Math.max(1, Math.round(mins))}m ago`;
  if (mins < 60 * 24) return `${Math.round(mins / 60)}h ago`;
  return `${Math.round(mins / 1440)}d ago`;
}
function staleness(ts) {
  if (!ts) return "never";
  const days = (Date.now() - new Date(ts + "Z").getTime()) / 86400000;
  return days > 7 ? "stale" : "ok";
}
const STATUS_CLASS = { "Qualified": "info", "Purchased": "ok", "Maintenance": "stale",
  "In Transit": "transit", "Disposed": "never", "Missing": "bad" };

const GROUP_FIELDS = { "": "No grouping", location: "Location",
  owner: "Owner", department: "Department", status: "Status" };
const SORT_FIELDS = { "": "Default", recent: "Recently entered", last_checkin: "Last check-in",
  status: "Status", cost_high: "Cost (high to low)", cost_low: "Cost (low to high)",
  date_new: "Purchased date (newest)", date_old: "Purchased date (oldest)", name: "Asset name" };

function sortAssets(list) {
  const arr = list.slice();
  const lastTime = a => a.last_checkin ? new Date(a.last_checkin + "Z").getTime() : 0;
  const cost = a => Number(a.cost || 0);
  const dateVal = a => a.date_purchased ? new Date(a.date_purchased + "T00:00:00").getTime() : 0;
  const entered = a => a.created_at ? new Date(a.created_at + "Z").getTime() : 0;
  if (SORT_BY === "recent") arr.sort((a, b) => entered(b) - entered(a));
  else if (SORT_BY === "last_checkin") arr.sort((a, b) => lastTime(b) - lastTime(a));
  else if (SORT_BY === "status") arr.sort((a, b) => (a.status || "").localeCompare(b.status || ""));
  else if (SORT_BY === "cost_high") arr.sort((a, b) => cost(b) - cost(a));
  else if (SORT_BY === "cost_low") arr.sort((a, b) => cost(a) - cost(b));
  else if (SORT_BY === "date_new") arr.sort((a, b) => dateVal(b) - dateVal(a));
  else if (SORT_BY === "date_old") arr.sort((a, b) => dateVal(a) - dateVal(b));
  else if (SORT_BY === "name") arr.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  return arr;
}

function groupAssets() {
  if (!GROUP_BY) return { "": sortAssets(ASSETS) };
  const groups = {};
  ASSETS.forEach(a => {
    const key = (a[GROUP_BY] || "(none)");
    (groups[key] = groups[key] || []).push(a);
  });
  Object.keys(groups).forEach(k => { groups[k] = sortAssets(groups[k]); });
  // "(none)" sorts last rather than first - a parenthesis beats every letter
  // alphabetically, so unassigned assets would otherwise head the page. This
  // matches how the Excel export orders its department groups.
  return Object.fromEntries(Object.entries(groups).sort(([a], [b]) => {
    if (a === "(none)") return 1;
    if (b === "(none)") return -1;
    return a.localeCompare(b);
  }));
}

function money(v) {
  if (v === null || v === undefined || v === "") return "";
  return "$" + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// Whole-dollar money for big headline numbers (no cents, avoids overflow).
function money0(v) {
  if (v === null || v === undefined || v === "") return "";
  return "$" + Math.round(Number(v)).toLocaleString();
}

// Stored dates are yyyy-mm-dd; show them as mm/dd/yyyy. "" when empty.
function fmtDate(isoDate) {
  if (!isoDate) return "";
  const p = String(isoDate).split("-");
  if (p.length !== 3) return isoDate;
  return `${p[1]}/${p[2]}/${p[0]}`;
}

const NAME_MAX = 55;    // chars shown before a name is truncated
const NAME_GRACE = 10;  // don't bother truncating to save fewer than this many chars

function toggleName(id, btn) {
  const el = document.getElementById("an_" + id);
  if (!el) return;
  const open = el.dataset.open === "1";
  el.textContent = open ? el.dataset.short : el.dataset.full;
  el.dataset.open = open ? "0" : "1";
  btn.textContent = open ? "more" : "less";
  const cell = el.closest("td");
  if (cell) cell.classList.toggle("expanded", !open);
}

function assetRow(a) {
  const inactive = a.active ? "" : " <span class='pill never'>inactive</span>";
  const dup = a.is_duplicate ? ` <span class="pill dup" title="Another asset shares this name/serial or key details">possible duplicate</span>` : "";
  const out = a.checked_out ? ` <span class="pill out" title="Checked out to ${escapeHtml(a.holder_department || "")}">out</span>` : "";
  const bell = a.reminders_due ? ` <span class="pill rem-due" title="${a.reminders_due} reminder(s) due">&#128276; ${a.reminders_due}</span>` : "";
  const full = a.name || "";
  const long = full.length > NAME_MAX + NAME_GRACE;
  const short = long ? full.slice(0, NAME_MAX).trimEnd() + "\u2026" : full;
  const selCell = can()
    ? `<td class="sel-col" onclick="event.stopPropagation()">
         <input type="checkbox" ${SELECTED.has(a.id) ? "checked" : ""}
                onchange="toggleSelect(${a.id}, event)" /></td>`
    : "";
  const nameCell = `<td class="asset-name">
      <b id="an_${a.id}" data-full="${escapeHtml(full)}" data-short="${escapeHtml(short)}">${escapeHtml(short)}</b>${inactive}${dup}${out}${bell}
      ${long ? `<button class="name-more" onclick="event.stopPropagation();toggleName(${a.id},this)">more</button>` : ""}
    </td>`;
  return `
    <tr class="clickable ${SELECTED.has(a.id) ? "row-selected" : ""}" onclick="openAsset(${a.id})">
      ${selCell}${nameCell}
      <td class="mono">${escapeHtml(a.asset_code || "\u2013")}</td>
      <td><span class="pill ${STATUS_CLASS[a.status] || 'ok'}">${a.status}</span></td>
      <td>${a.last_checkin ? `<span class="pill ${staleness(a.last_checkin)}">${fmtAgo(a.last_checkin)}</span>` : `<span class="pill never">never</span>`}</td>
      <td>${escapeHtml(a.department || "")}</td>
      <td>${escapeHtml(a.owner || "")}</td>
      <td>${escapeHtml(a.vendor || "")}</td>
      <td>${escapeHtml(a.location || "")}</td>
      <td class="cost-cell">${money(a.cost)}</td>
      <td class="dim">${fmtDate(a.date_purchased)}</td>
      <td onclick="event.stopPropagation()">
        <button class="btn small" onclick="printLabel(${a.id})">Label</button>
      </td>
    </tr>`;
}

// The select-checkbox column only exists for admins (see assetRow's selCell).
// The header has to follow the same rule - emitting the <th> unconditionally
// shifted every column one to the left for non-admins, which is why the

function tableHead() { return `<thead><tr>${can() ? `<th class="sel-col"></th>` : ""}<th>Asset</th><th>ID</th><th>Status</th><th>Last check-in</th>
  <th>Department</th><th>Owner</th><th>Vendor</th><th>Location</th><th class="cost-cell">Cost</th><th>Purchased</th><th></th></tr></thead>`; }

async function bulkStatus(status) {
  const ids = [...SELECTED];
  if (!status || !ids.length) return;
  if (!confirm(`Set ${ids.length} asset${ids.length === 1 ? "" : "s"} to "${status}"?`)) return;
  try {
    const r = await api("/assets/bulk-status", { method: "POST", body: { ids, status } });
    SELECTED.clear();
    await loadAssets();
    renderDashboard();
    alert(`${r.updated} asset${r.updated === 1 ? "" : "s"} set to ${status}.`);
  } catch (e) { alert(e.message); }

function allVisibleSelected() {
  const ids = ASSETS.map(a => a.id);

async function bulkAction(action) {
  const ids = [...SELECTED];
  if (!ids.length) return;
  const verb = { delete: "permanently delete", deactivate: "deactivate", reactivate: "reactivate" }[action];
  const warn = action === "delete"
    ? `\n\nThis also removes their check-in and status history. It cannot be undone.`
    : "";
  if (!confirm(`${verb[0].toUpperCase()+ verb.slice(1)} ${ids.length} asset${ids.length === 1 ? "" : "s"}?${warn}`)) return;
  try {
    const r = await api("/assets/bulk", { method: "POST", body: { action, ids } });
    SELECTED.clear();
    await loadAssets();
    renderDashboard();
    alert(`${r.affected} asset${r.affected === 1 ? "" : "s"} ${action === "delete" ? "deleted" : action + "d"}.`);
  } catch (e) { alert(e.message); }
}

// Mirrors each table's horizontal scroll into a matching bar above it, so you
// can scroll wide tables without hunting for the scrollbar at the bottom.
function syncTableScrollbars() {
  document.querySelectorAll('.tablewrap[data-sync]').forEach(wrap => {
    const top = document.querySelector(`.tablescroll-top[data-sync="${wrap.dataset.sync}"]`);
    if (!top) return;
    const spacer = top.firstElementChild;
    const table = wrap.querySelector("table");
    const width = table ? table.scrollWidth : 0;
    spacer.style.width = width + "px";
    // only show the top bar when there's actually overflow
    top.style.display = width > wrap.clientWidth ? "" : "none";
    let lock = false;
    top.onscroll = () => { if (lock) return; lock = true; wrap.scrollLeft = top.scrollLeft; lock = false; };
    wrap.onscroll = () => { if (lock) return; lock = true; top.scrollLeft = wrap.scrollLeft; lock = false; };
  });
}

const STAT_COLORS = { Purchased: "#1f8a5f", Qualified: "#1a6fa8", Maintenance: "#b4791f",
                      "In Transit": "#0f7a8c", Disposed: "#7b879b", Missing: "#b23b3b" };

function kpi(label, value, sub) {
  return `<div class="kpi"><div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ""}</div>`;
}

// Horizontal bars. Deliberately hand-rolled rather than pulling in a chart
// library — the app ships no frontend dependencies and these are simple.
function barChart(rows, opts = {}) {
  if (!rows.length) return `<div class="empty">No data yet.</div>`;
  const key = opts.valueKey || "count";
  const max = Math.max(...rows.map(r => r[key])) || 1;
  const fmt = opts.format || (v => v);
  return `<div class="bars">${rows.map(r => `
    <div class="bar-row">
      <div class="bar-label" title="${escapeHtml(r.label)}">${escapeHtml(r.label)}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${Math.max(2, (r[key] / max) * 100)}%;
             background:${opts.color ? (STAT_COLORS[r.label] || opts.color) : "var(--accent)"}"></div>
      </div>
      <div class="bar-value">${fmt(r[key])}</div>
    </div>`).join("")}</div>`;
}

function sparkBars(points) {
  const max = Math.max(...points.map(p => p.count), 1);
  const total = points.reduce((s, p) => s + p.count, 0);
  return `<div class="spark">${points.map(p => `
    <div class="spark-col" title="${p.date}: ${p.count} check-in${p.count === 1 ? "" : "s"}">
      <div class="spark-bar" style="height:${Math.max(2, (p.count / max) * 100)}%"></div>
    </div>`).join("")}</div>
    <div class="help" style="margin-top:6px">${total} check-in${total === 1 ? "" : "s"} in the last 30 days</div>`;
}

    DEACT_IDS = DEACT_ROWS.map(a => a.id);
    // drop any ids that no longer exist (deleted/reactivated since last render)
    DEACT_SELECTED = new Set([...DEACT_SELECTED].filter(i => DEACT_IDS.includes(i)));
    renderDeactivated();
  } catch (e) {
    box.innerHTML = `<div class="card ana-card"><h4>Deactivated assets</h4>
      <div class="help" style="color:var(--red)">Couldn't load. Try Refresh.</div></div>`;
  }
}

// Pure re-render from the cached rows. Toggling a checkbox used to call
// loadDeactivated(), which refetched every asset over the network for each
// individual click - painful with 69 rows and a Select all.
function renderDeactivated() {
  const box = document.getElementById("deactivatedBox");
  if (!box) return;
  const gone = DEACT_ROWS;
  if (!gone.length) {
    DEACT_SELECTED.clear();
    box.innerHTML = `<div class="card ana-card"><h4>Deactivated assets</h4>
      <div class="help">None. Deactivated assets appear here, where they can be reactivated or permanently deleted.</div></div>`;
    return;
  }
  const n = DEACT_SELECTED.size;
  const allChecked = DEACT_IDS.length > 0 && DEACT_IDS.every(i => DEACT_SELECTED.has(i));
  box.innerHTML = `<div class="card ana-card">
    <h4>Deactivated assets (${gone.length})</h4>
    <div class="help" style="margin-bottom:8px">Hidden from the main dashboard. Reactivate to bring one back,
      or permanently delete it (removes the asset and its history \u2014 can't be undone).</div>
    <div class="row" style="gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
      <label class="row" style="gap:6px;align-items:center">
        <input type="checkbox" ${allChecked ? "checked" : ""} onchange="deactSelectAll(this.checked)" />
        <span class="help">Select all (${gone.length})</span></label>
      <span style="flex:1"></span>
      ${n ? `<span class="help"><b>${n}</b> selected</span>
        <button class="btn small" onclick="deactBulk('reactivate')">Reactivate ${n}</button>
        <button class="btn small danger" onclick="deactBulk('delete')">Delete ${n}</button>
        <button class="sel-x" onclick="deactClear()" title="Clear selection" aria-label="Clear selection">&times;</button>` : ""}
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th style="width:28px"></th><th>Asset</th><th>ID</th><th>Department</th><th>Location</th><th></th></tr></thead>
      <tbody>${gone.map(a => `<tr>
        <td><input type="checkbox" ${DEACT_SELECTED.has(a.id) ? "checked" : ""}
                   onchange="deactToggle(${a.id})" /></td>
        <td><b>${escapeHtml(a.name || "")}</b></td>
        <td class="mono">${escapeHtml(a.code || "")}</td>
        <td>${escapeHtml(a.department || "\u2013")}</td>
        <td>${escapeHtml(a.location || "\u2013")}</td>
        <td style="white-space:nowrap">
          <button class="btn small" onclick="reactivateAsset(${a.id})">Reactivate</button>
          <button class="btn small danger" onclick="deletePermanently(${a.id})">Delete</button>
        </td>
      </tr>`).join("")}</tbody>
    </table></div>
  </div>`;
}

function deactToggle(id) {
  if (DEACT_SELECTED.has(id)) DEACT_SELECTED.delete(id); else DEACT_SELECTED.add(id);
  renderDeactivated();
}
function deactSelectAll(on) {
  if (on) DEACT_IDS.forEach(i => DEACT_SELECTED.add(i)); else DEACT_SELECTED.clear();
  renderDeactivated();
}
function deactClear() { DEACT_SELECTED.clear(); renderDeactivated(); }

async function deactBulk(action) {
  const ids = [...DEACT_SELECTED];
  if (!ids.length) return;
  const msg = action === "delete"
    ? `Permanently delete ${ids.length} asset${ids.length === 1 ? "" : "s"} and all their history?\n\nThis cannot be undone.`
    : `Reactivate ${ids.length} asset${ids.length === 1 ? "" : "s"}?`;
  if (!confirm(msg)) return;
  try {
    const r = await api("/assets/bulk", { method: "POST", body: { action, ids } });
    DEACT_SELECTED.clear();
    await loadAssets();
    await loadDeactivated();
    alert(`${r.affected} asset${r.affected === 1 ? "" : "s"} ${action === "delete" ? "deleted" : "reactivated"}.`);
  } catch (e) { alert(e.message); }
}

async function reactivateAsset(id) {
  try {
    await api("/assets/bulk", { method: "POST", body: { action: "reactivate", ids: [id] } });
    DEACT_SELECTED.delete(id);
    await loadAssets();
    loadDeactivated();
  } catch (e) { alert(e.message); }
}

async function deletePermanently(id) {
  if (!confirm("Permanently delete this asset and all its history? This cannot be undone.")) return;
  try {
    await api("/assets/bulk", { method: "POST", body: { action: "delete", ids: [id] } });
    DEACT_SELECTED.delete(id);
    await loadAssets();
    loadDeactivated();
  } catch (e) { alert(e.message); }
}

/* --------------------------------------------------------- activity feed page */
function activityDayLabel(iso) {
  const d = new Date(iso + "Z");
  const startOf = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((startOf(new Date()) - startOf(d)) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
}

function activityItem(e) {
  const when = new Date(e.ts + "Z");
  const ago = fmtAgo(e.ts) || "";
  const who = e.who ? `<b>${escapeHtml(e.who)}</b>` : `<span class="dim">Someone</span>`;
  const name = escapeHtml(e.asset_name) + (e.asset_active === false ? ' <span class="dim">(inactive)</span>' : "");
  const assetLink = `<a href="#" onclick="event.preventDefault();openAsset(${e.asset_id})">${name}</a>`;
  let node, line, note = "";
  if (e.type === "status") {
    node = `<span class="act-node status">&#8646;</span>`;
    line = `${who} changed ${assetLink}
      <span class="pill ${STATUS_CLASS[e.old_status] || 'ok'}">${escapeHtml(e.old_status)}</span> &rarr;
      <span class="pill ${STATUS_CLASS[e.new_status] || 'ok'}">${escapeHtml(e.new_status)}</span>`;
    if (e.note) note = `<div class="act-note">${escapeHtml(e.note)}</div>`;
  } else {
    node = `<span class="act-node note">&#9998;</span>`;
    line = `${who} added a note on ${assetLink}`;
    note = `<div class="act-note">${escapeHtml(e.note)}</div>`;
  }
  return `<div class="act-item">${node}
    <div class="act-card">
      <div class="act-head">
        <div class="act-line">${line}</div>
        <span class="act-time" title="${when.toLocaleString()}">${ago}</span>
      </div>
      ${note}
    </div></div>`;
}

let ACT_EVENTS = [];
let ACT_FILTER = "all";   // "all" | "note" | "status"
let ACT_HAS_MORE = false;
let ACT_OLDEST = null;
let ACT_LOADING_MORE = false;

function setActivityFilter(v) {
  ACT_FILTER = v;
  renderActivityFeed(ACT_EVENTS);
}

async function loadMoreActivity() {
  if (ACT_LOADING_MORE || !ACT_OLDEST) return;
  ACT_LOADING_MORE = true;
  const btn = document.getElementById("actMore");
  if (btn) btn.textContent = "Loading\u2026";
  try {
    const data = await api(`/activity?limit=50&before=${encodeURIComponent(ACT_OLDEST)}`);
    ACT_EVENTS = ACT_EVENTS.concat(data.events);
    ACT_HAS_MORE = data.has_more;
    ACT_OLDEST = data.oldest;
    renderActivityFeed(ACT_EVENTS);
  } catch (e) { /* leave the button for a retry */ }
  ACT_LOADING_MORE = false;
}

function renderActivityFeed(events) {
  const box = document.getElementById("activityFeed");
  if (!box) return;
  const shown = ACT_FILTER === "all" ? events : events.filter(e => e.type === ACT_FILTER);
  if (!shown.length) {
    box.innerHTML = `<div class="empty">${events.length ? "Nothing matches this filter." : "No notes or status changes yet."}</div>`;
    return;
  }
  let html = "", lastDay = null;
  for (const e of shown) {
    const day = activityDayLabel(e.ts);
    if (day !== lastDay) { html += `<div class="act-day">${day}</div>`; lastDay = day; }
    html += activityItem(e);
  }
  // "Load more" pages the whole feed; the filter then applies to what's loaded.
  if (ACT_HAS_MORE) {
    html += `<div class="row-more" id="actMore" onclick="loadMoreActivity()">Load older activity</div>`;
  }
  box.innerHTML = html;
}

// Opening the Activity page marks everything as read. The marker comes from
// the server's own max(ts) rather than the feed's first row, so the value we
// store is exactly the one the unread count compares against - no precision
// or clock-skew mismatch between the two endpoints.
async function markActivitySeen() {
  try {
    const r = await api("/activity/unread?since=");
    if (r.latest) localStorage.setItem(ACT_SEEN_KEY, r.latest);
  } catch (e) {
    // Fall back to the newest event we actually rendered.
    if (ACT_EVENTS.length) localStorage.setItem(ACT_SEEN_KEY, ACT_EVENTS[0].ts);
  }
  const badge = document.getElementById("actBadge");
  if (badge) badge.style.display = "none";
}

let SCAN_CHECKOUT_DEPT_NAME = "";

function renderScan() {
  const deptOpts = DEPARTMENTS.map(d => `<option value="${d.id}" ${String(d.id) === SCAN_CHECKOUT_DEPT ? "selected" : ""}>${escapeHtml(d.name)}</option>`).join("");

        <img src="/static/frore-logo.png" class="frore-logo" alt="Frore logo" />

          <div class="brand-subtitle">Inventory Management Dashboard</div>
        </div>
      </div>
      <div class="help" style="color:#b7c9e6">${escapeHtml(ME.full_name || "Guest")}</div>

          ${modeBtn("checkout", "Check out to\u2026")}
          ${modeBtn("return", "Return")}
        </div>
        ${SCAN_MODE === "checkout" ? `
          <div class="scan-dept">
            <label class="row" style="gap:8px"><span class="help">Lending everything scanned to:</span>
              <select id="scanDept" onchange="setScanDept(this)">
                <option value="">Select department\u2026</option>${deptOpts}</select></label>
          </div>` : ""}
        <div class="help scan-hint" id="scanHint"></div>
        <input id="scanInput" class="scan-input" placeholder="Scan or type a code&hellip;" autofocus />
        <div id="scanFeed" class="scan-feed"></div>
      </div>
    </div>`;
  updateScanHint();
  const input = document.getElementById("scanInput");
  input.focus();
  input.addEventListener("keydown", async (e) => {

function setScanMode(m) {
  SCAN_MODE = m;
  renderScan();
}
function setScanDept(sel) {
  SCAN_CHECKOUT_DEPT = sel.value;
  SCAN_CHECKOUT_DEPT_NAME = sel.options[sel.selectedIndex].text;
  updateScanHint();
  document.getElementById("scanInput").focus();
}
function updateScanHint() {
  const hint = document.getElementById("scanHint");
  if (!hint) return;
  const msg = {
    lookup: "Each scan opens the asset so you can review or edit it.",
    checkin: "Each scan logs an inventory \u201cseen\u201d check-in. Just keep scanning.",
    checkout: SCAN_CHECKOUT_DEPT
      ? `Each scan checks the asset out to <b>${escapeHtml(SCAN_CHECKOUT_DEPT_NAME)}</b>. Keep scanning to lend a whole batch.`
      : "Pick a department above first \u2014 then every scan lends that asset to it.",
    return: "Each scan checks the asset back in from wherever it was borrowed.",
  }[SCAN_MODE];
  hint.innerHTML = msg;
}

async function submitScan(code) {
  const feed = document.getElementById("scanFeed");
  // Look-up mode opens the asset instead of streaming a feed row.
  if (SCAN_MODE === "lookup") {
    try {
      const r = await api("/scan-action", { method: "POST", body: { code, mode: "lookup" } });
      openAsset(r.id);
    } catch (e) {
      SCAN_FEED.unshift({ ok: false, code, error: e.message });
      paintScanFeed();
    }
    return;
  }
  if (SCAN_MODE === "checkout" && !SCAN_CHECKOUT_DEPT) {
    SCAN_FEED.unshift({ ok: false, code, error: "Pick a department first" });
    paintScanFeed(); return;
  }
  try {
    const body = { code, mode: SCAN_MODE };
    if (SCAN_MODE === "checkout") body.department_id = Number(SCAN_CHECKOUT_DEPT);
    const r = await api("/scan-action", { method: "POST", body });
    SCAN_FEED.unshift({ ok: true, name: r.name, asset_code: r.asset_code,
                        msg: r.message, ts: new Date().toISOString() });
  } catch (e) {
    SCAN_FEED.unshift({ ok: false, code, error: e.message });
  }
  paintScanFeed();
}

function paintScanFeed() {
  const feed = document.getElementById("scanFeed");
  if (!feed) return;
  feed.innerHTML = SCAN_FEED.slice(0, 40).map(s => s.ok
    ? `<div class="scan-hit"><span class="dot"></span>
         <span class="name">${escapeHtml(s.name)}</span>
         <span class="help mono">${escapeHtml(s.asset_code || "")}</span>
         <span class="scan-msg">${escapeHtml(s.msg || "")}</span>
         <span class="time">${new Date(s.ts + (s.ts.endsWith("Z") ? "" : "Z")).toLocaleTimeString()}</span></div>`
    : `<div class="scan-hit miss"><span class="dot"></span>
         <span class="name">Not found: ${escapeHtml(s.code)}</span>
         <span class="time">${escapeHtml(s.error)}</span></div>`
  ).join("");
}

function deptOptions(selectedId) {

function statusOptions(selected) {

}

function classOptions(selected) {
  const options = CLASSES.slice();
  if (selected && !options.includes(selected)) options.unshift(selected);
  return `<option value="" ${!selected ? "selected" : ""}>Select\u2026</option>` +
    options.map(c => `<option value="${escapeHtml(c)}" ${c === selected ? "selected" : ""}>${escapeHtml(c)}</option>`).join("");
}

// When a department is picked and equipment type is still blank, prefill the
// type that department usually buys — overridable, just saves a click.

// Location doubles as the asset-code prefix area. Imported assets often have
// free-text locations that aren't on the list — keep them as a selected option
// so editing an asset never silently wipes its existing location.
function locationOptions(selected) {
  const options = LOCATIONS.slice();
  if (selected && !options.includes(selected)) options.unshift(selected);
  return `<option value="" ${!selected ? "selected" : ""}>Select\u2026</option>` +
    options.map(l => `<option value="${escapeHtml(l)}" ${l === selected ? "selected" : ""}>${escapeHtml(l)}</option>`).join("");
}
// Parses a user-typed mm/dd/yyyy string into the yyyy-mm-dd the API stores.
// Returns "" for empty, or null if the text isn't a valid mm/dd/yyyy date.
function displayDateToIso(s) {
  s = (s || "").trim();
  if (!s) return "";
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const mm = m[1].padStart(2, "0"), dd = m[2].padStart(2, "0"), yyyy = m[3];
  const iso = `${yyyy}-${mm}-${dd}`;
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime()) || d.getUTCDate() !== Number(dd) || (d.getUTCMonth() + 1) !== Number(mm))
    return null;
  return iso;
}

function autoSlashDateInput(el) {
  let digits = el.value.replace(/\D/g, "").slice(0, 8);
  if (digits.length >= 5) el.value = `${digits.slice(0,2)}/${digits.slice(2,4)}/${digits.slice(4)}`;
  else if (digits.length >= 3) el.value = `${digits.slice(0,2)}/${digits.slice(2)}`;
  else el.value = digits;
}

function formatCostForInput(value) {
  if (value === null || value === undefined || value === "") return "";
  const parts = String(value).replace(/[^\d.]/g, "").split(".");
  const whole = parts[0] || "";
  const decimals = parts.length > 1 ? "." + parts.slice(1).join("").slice(0, 2) : "";
  return whole.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + decimals;
}

function cleanCostInput(value) {
  return (value || "").replace(/,/g, "") || null;
}

function attachAssetFormFormatters() {
  const dateInput = document.getElementById("f_date_purchased");
  if (dateInput) dateInput.addEventListener("input", () => autoSlashDateInput(dateInput));
  const costInput = document.getElementById("f_cost");
  if (costInput) costInput.addEventListener("input", () => {
    const posFromEnd = costInput.value.length - costInput.selectionStart;
    costInput.value = formatCostForInput(costInput.value);
    const nextPos = Math.max(0, costInput.value.length - posFromEnd);
    costInput.setSelectionRange(nextPos, nextPos);
  });
}

// Fields an asset code needs. Checked only when Save is pressed, never on open.

async function saveAsset(id) {
  const iso = displayDateToIso(document.getElementById("f_date_purchased").value);
  if (iso === null) return alert("Date purchased must be in mm/dd/yyyy format (or left blank).");
  const body = {
    name: document.getElementById("f_name").value,
    department_id: document.getElementById("f_department").value ? Number(document.getElementById("f_department").value) : null,
    owner: document.getElementById("f_owner").value,
    vendor: document.getElementById("f_vendor").value,
    location: document.getElementById("f_location").value,
    asset_class: document.getElementById("f_asset_class").value,
    cost: cleanCostInput(document.getElementById("f_cost").value),
    date_purchased: iso || null,
    status: document.getElementById("f_status").value,
    status_note: document.getElementById("f_status_note").value,
    notes: document.getElementById("f_notes").value,
  };
  if (!body.name) return alert("Name is required.");

  try {
    if (id) await api(`/assets/${id}`, { method: "PUT", body });
    else await api("/assets", { method: "POST", body });
    closeModal(); await loadAssets(); renderDashboard();
  } catch (e) { alert(e.message); }
}


// Deactivating is reversible and keeps the asset's history. Permanent deletion
// lives only in Analytics -> Deactivated assets, so it can't be hit by accident
// from the everyday edit form.
async function deactivateAsset(id) {
  if (!confirm("Deactivate this asset?\n\nIt's hidden from the main list but keeps its history, and can be reactivated from Analytics \u2192 Deactivated assets.")) return;
  try {
    await api("/assets/bulk", { method: "POST", body: { action: "deactivate", ids: [id] } });
    closeModal(); await loadAssets(); renderDashboard();
  } catch (e) { alert(e.message); }
}
async function reactivateFromForm(id) {
  try {
    await api("/assets/bulk", { method: "POST", body: { action: "reactivate", ids: [id] } });
    closeModal(); await loadAssets(); renderDashboard();
  } catch (e) { alert(e.message); }
}

/* --------------------------------------------------- asset detail modal */
const SCAN_SOURCE_LABEL = { qr_scan: "QR scan", barcode_scan: "barcode", manual_admin: "manual" };

function historyRow(h) {
  if (h.type === "scan") {
    const label = SCAN_SOURCE_LABEL[h.source] || "scan";
    return `<tr><td class="mono">${new Date(h.ts + "Z").toLocaleString()}</td>
      <td><span class="pill info">${label}</span></td>
      <td>${escapeHtml(h.checked_in_by || "")}</td>
      <td>Checked in</td>
      <td>${escapeHtml(h.note || "")}</td>
      <td>${h.lat != null ? `<a href="https://maps.google.com/?q=${h.lat},${h.lon}" target="_blank">map (&plusmn;${Math.round(h.accuracy_m || 0)}m)</a>` : ""}</td></tr>`;
  }
  const changed = h.old_status && h.old_status !== h.new_status;
  const details = h.old_status
    ? (changed ? `${escapeHtml(h.old_status)} &rarr; <b>${escapeHtml(h.new_status)}</b>` : "Note added")
    : `Set to <b>${escapeHtml(h.new_status)}</b>`;
  return `<tr><td class="mono">${new Date(h.ts + "Z").toLocaleString()}</td>
    <td><span class="pill ${STATUS_CLASS[h.new_status] || 'ok'}">status</span></td>
    <td>${escapeHtml(h.changed_by || "")}</td>
    <td>${details}</td>
    <td>${escapeHtml(h.note || "")}</td>
    <td></td></tr>`;
}

function switchAssetTab(name, btn) {
  document.querySelectorAll('.asset-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.asset-tabpanel').forEach(p => p.style.display = 'none');
  if (btn) btn.classList.add('active');
  const panel = document.getElementById('tabpanel-' + name);
  if (panel) panel.style.display = '';
}

function statusTimelineRow(h) {
  const changed = h.old_status && h.old_status !== h.new_status;
  const detail = h.old_status
    ? (changed ? `${escapeHtml(h.old_status)} &rarr; <b>${escapeHtml(h.new_status)}</b>` : "Note added")
    : `Set to <b>${escapeHtml(h.new_status)}</b>`;
  return `<tr><td class="mono">${new Date(h.ts + "Z").toLocaleString()}</td>
    <td><span class="pill ${STATUS_CLASS[h.new_status] || 'ok'}">${escapeHtml(h.new_status)}</span></td>
    <td>${detail}</td>
    <td>${escapeHtml(h.changed_by || "")}</td>
    <td>${escapeHtml(h.note || "")}</td></tr>`;
}

/* --------------------------------------------- custody (check out / in) */
function custodyBanner(a) {
  if (a.checked_out) {
    const who = a.holder_person ? `${escapeHtml(a.holder_person)} (${escapeHtml(a.holder_department || "?")})`
                                : escapeHtml(a.holder_department || "?");
    const since = a.checked_out_at ? fmtAgo(a.checked_out_at) : "";
    const due = a.due_back ? ` &middot; due back ${fmtDate(a.due_back)}` : "";
    const overdue = a.due_back && new Date(a.due_back) < new Date();
    return `<div class="custody-banner ${overdue ? "overdue" : "out"}">
      <div><b>Checked out</b> to ${who}${a.checked_out_at ? ` &middot; ${since}` : ""}${due}
        ${overdue ? ` <span class="pill bad">overdue</span>` : ""}</div>
      <button class="btn small" onclick="doCheckin(${a.id})">Check in (returned)</button>
    </div>`;
  }
  return `<div class="custody-banner available">
    <div><b>Available</b> &middot; at home location</div>
    <button class="btn small" onclick="checkoutDialog(${a.id})">Check out / lend</button>
  </div>`;
}

function checkoutDialog(id) {
  const deptOpts = DEPARTMENTS.map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join("");
  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:460px">
        <header><h3>Check out asset</h3><button class="x" onclick="openAsset(${id})">&times;</button></header>
        <div class="body">
          <label class="f"><span>Borrowing department *</span>
            <select id="co_dept"><option value="">Select\u2026</option>${deptOpts}</select></label>
          <label class="f" style="margin-top:10px"><span>Person (optional)</span>
            <input id="co_person" placeholder="e.g. Jordan Lee" autocomplete="off" /></label>
          <label class="f" style="margin-top:10px"><span>Expected back (optional)</span>
            <input id="co_due" placeholder="mm/dd/yyyy" autocomplete="off" /></label>
          <label class="f" style="margin-top:10px"><span>Note (optional)</span>
            <input id="co_note" placeholder="what it's for" autocomplete="off" /></label>
          <div id="co_err" class="help" style="color:var(--red);margin-top:8px"></div>
        </div>
        <footer>
          <button class="btn" onclick="openAsset(${id})">Cancel</button>
          <button class="btn primary" onclick="doCheckout(${id})">Check out</button>
        </footer>
      </div>
    </div>`);
}

async function doCheckout(id) {
  const err = document.getElementById("co_err"); err.textContent = "";
  const dept = document.getElementById("co_dept").value;
  if (!dept) { err.textContent = "Pick a borrowing department."; return; }
  const dueRaw = document.getElementById("co_due").value.trim();
  const due = dueRaw ? displayDateToIso(dueRaw) : "";
  if (due === null) { err.textContent = "Expected-back date must be mm/dd/yyyy."; return; }
  try {
    await api(`/assets/${id}/checkout`, { method: "POST", body: {
      department_id: Number(dept),
      person: document.getElementById("co_person").value,
      due_back: due || null,
      note: document.getElementById("co_note").value,
    }});
    await loadAssets(); openAsset(id);
  } catch (e) { err.textContent = e.message; }
}

async function doCheckin(id) {
  try {
    await api(`/assets/${id}/checkin_custody`, { method: "POST", body: {} });
    await loadAssets(); openAsset(id);
  } catch (e) { alert(e.message); }
}

/* --------------------------------------------- reminders */
const REMINDER_STATE_LABEL = { overdue: "Overdue", due: "Due today", soon: "Due soon", upcoming: "Upcoming" };

function remindersSection(a) {
  const rems = a.reminders || [];
  const rows = rems.length ? rems.map(r => `
    <div class="rem-row rem-${r.state}">
      <div class="rem-main">
        <span class="rem-dot"></span>
        <div>
          <div class="rem-label">${escapeHtml(r.label)}
            ${r.active ? "" : `<span class="help">(done)</span>`}</div>
          <div class="help">${r.kind === "interval" ? `every ${r.interval_days} days` : "one-off"}
            ${r.next_due && r.active ? ` &middot; ${r.state === "overdue" ? "was due" : "due"} ${fmtDate(r.next_due)}` : ""}
            ${r.active && r.days_until !== null ? ` (${r.days_until < 0 ? `${-r.days_until}d overdue` : r.days_until === 0 ? "today" : `in ${r.days_until}d`})` : ""}</div>
        </div>
      </div>
      <div class="rem-actions">
        ${r.active ? `<button class="btn small" onclick="doneReminder(${r.id}, ${a.id})">Mark done</button>` : ""}
        <button class="btn small danger" onclick="deleteReminder(${r.id}, ${a.id})">&times;</button>
      </div>
    </div>`).join("") : `<div class="help" style="padding:4px 0">No reminders on this asset.</div>`;
  return `<div class="rem-block">
    <div class="row" style="justify-content:space-between;margin-bottom:4px">
      <h4 style="margin:6px 0;font-family:var(--display)">Reminders</h4>
      <button class="btn small" onclick="reminderDialog(${a.id})">+ Add reminder</button>
    </div>
    ${rows}
  </div>`;
}

function reminderDialog(assetId, bulkIds) {
  const bulk = Array.isArray(bulkIds) && bulkIds.length;
  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:460px">
        <header><h3>${bulk ? `Add reminder to ${bulkIds.length} assets` : "Add reminder"}</h3>
          <button class="x" onclick="${bulk ? "closeModal()" : `openAsset(${assetId})`}">&times;</button></header>
        <div class="body">
          <label class="f"><span>Label *</span>
            <input id="rm_label" placeholder="e.g. Calibration check" autocomplete="off" /></label>
          <label class="f" style="margin-top:10px"><span>Type</span>
            <select id="rm_kind" onchange="remKindChange()">
              <option value="interval">Recurring (every N days)</option>
              <option value="date">One-off (specific date)</option>
            </select></label>
          <label class="f" style="margin-top:10px" id="rm_interval_wrap"><span>Repeat every (days)</span>
            <input id="rm_interval" type="number" min="1" placeholder="e.g. 90" /></label>
          <label class="f" style="margin-top:10px" id="rm_date_wrap"><span>First due / date <span id="rm_date_opt">(optional)</span></span>
            <input id="rm_date" placeholder="mm/dd/yyyy" autocomplete="off" /></label>
          <label class="f" style="margin-top:10px"><span>Note (optional)</span>
            <input id="rm_note" autocomplete="off" /></label>
          <div id="rm_err" class="help" style="color:var(--red);margin-top:8px"></div>
        </div>
        <footer>
          <button class="btn" onclick="${bulk ? "closeModal()" : `openAsset(${assetId})`}">Cancel</button>
          <button class="btn primary" onclick="${bulk ? `saveReminderBulk(${JSON.stringify(bulkIds)})` : `saveReminder(${assetId})`}">Add</button>
        </footer>
      </div>
    </div>`);
  remKindChange();
}

function remKindChange() {
  const kind = document.getElementById("rm_kind").value;
  document.getElementById("rm_interval_wrap").style.display = kind === "interval" ? "" : "none";
  document.getElementById("rm_date_opt").style.display = kind === "interval" ? "" : "none";
  const dateWrap = document.getElementById("rm_date_wrap");
  dateWrap.querySelector("span").childNodes[0].nodeValue =
    kind === "interval" ? "First due " : "Date ";
}

function reminderBody() {
  const kind = document.getElementById("rm_kind").value;
  const dateRaw = document.getElementById("rm_date").value.trim();
  const iso = dateRaw ? displayDateToIso(dateRaw) : "";
  if (iso === null) return { err: "Date must be mm/dd/yyyy." };
  const body = { label: document.getElementById("rm_label").value,
    kind, note: document.getElementById("rm_note").value };
  if (kind === "interval") {
    body.interval_days = Number(document.getElementById("rm_interval").value);
    if (iso) body.next_due = iso;
  } else {
    if (!iso) return { err: "A one-off reminder needs a date." };
    body.next_due = iso;
  }
  return { body };
}

async function saveReminder(assetId) {
  const err = document.getElementById("rm_err"); err.textContent = "";
  const { body, err: e } = reminderBody();
  if (e) { err.textContent = e; return; }
  try {
    await api(`/assets/${assetId}/reminders`, { method: "POST", body });
    await loadAssets(); openAsset(assetId);
  } catch (ex) { err.textContent = ex.message; }
}

async function saveReminderBulk(ids) {
  const err = document.getElementById("rm_err"); err.textContent = "";
  const { body, err: e } = reminderBody();
  if (e) { err.textContent = e; return; }
  body.asset_ids = ids;
  try {
    const r = await api(`/reminders/bulk`, { method: "POST", body });
    closeModal(); SELECTED.clear(); await loadAssets(); renderDashboard();
    alert(`Reminder added to ${r.created} asset${r.created === 1 ? "" : "s"}.`);
  } catch (ex) { err.textContent = ex.message; }
}

async function doneReminder(id, assetId) {
  try { await api(`/reminders/${id}/done`, { method: "POST", body: {} });
    await loadAssets(); openAsset(assetId);
  } catch (e) { alert(e.message); }
}

async function deleteReminder(id, assetId) {
  if (!confirm("Delete this reminder?")) return;
  try { await api(`/reminders/${id}`, { method: "DELETE" });
    await loadAssets(); openAsset(assetId);
  } catch (e) { alert(e.message); }
}

async function openAsset(id) {
  const a = await api(`/assets/${id}`);
  try { a.reminders = (await api(`/assets/${id}/reminders`)).reminders; }
  catch (e) { a.reminders = []; }
  const isAdmin = IS_ADMIN;
  const statusAge = fmtAgo(a.status_updated_at);
  const scans = a.history.filter(h => h.type === "scan");
  const warning = a.status === "Missing"
    ? `<div class="status-warning bad">&#9888;&#65039; This asset is currently marked <b>Missing</b>.</div>`
    : "";

  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:800px">
        <header><h3>${escapeHtml(a.name)} <span class="mono" style="font-weight:400;color:#667">${a.code}</span></h3>
          <button class="btn small" onclick='assetForm(${JSON.stringify(a).replace(/'/g, "&#39;")})'>Edit</button>
          <button class="x" onclick="closeModal()">&times;</button></header>
        <div class="body">

          <div class="asset-tabs" role="tablist" aria-label="Asset detail sections">
            <button class="asset-tab active" role="tab" onclick="switchAssetTab('overview', this)">Overview</button>
            <button class="asset-tab" role="tab" onclick="switchAssetTab('status', this)">Asset Status</button>
            <button class="asset-tab" role="tab" onclick="switchAssetTab('activity', this)">Activity / Check-ins</button>
          </div>

          <!-- ---------------------------------------------------- Overview -->
          <div id="tabpanel-overview" class="asset-tabpanel">
            <div class="row" style="align-items:flex-start">
              <div class="asset-media">
                <div class="asset-code-stack">
                  <img class="qr" src="/api/assets/${a.id}/qr.png" />
                  <img class="barcode" src="/api/assets/${a.id}/barcode.png" />
                </div>
                <div class="asset-media-actions">
                  <button class="btn small" onclick="exportToPrint([${a.id}])">Export to Print</button>
                  <a class="btn small" style="text-decoration:none" href="${a.checkin_url}" target="_blank">Open check-in page</a>
                  <button class="btn small" onclick="manualCheckin(${a.id})">Manually check in</button>
                </div>
              </div>
              <div style="flex:1">
                <div class="row" style="margin-bottom:10px">
                  <span class="pill ${STATUS_CLASS[a.status] || 'ok'}" style="font-size:13px">${escapeHtml(a.status)}</span>
                  ${a.status_note ? `<span class="help">${escapeHtml(a.status_note)}</span>` : ""}
                </div>
                <div class="grid2">
                  <div><div class="help">Department</div><div>${escapeHtml(a.department || "\u2013")}</div></div>
                  <div><div class="help">Owner</div><div>${escapeHtml(a.owner || "\u2013")}</div></div>
                  <div><div class="help">Vendor</div><div>${escapeHtml(a.vendor || "\u2013")}</div></div>
                  <div><div class="help">Location (home base)</div><div>${escapeHtml(a.location || "\u2013")}</div></div>
                  <div><div class="help">Cost</div><div>${a.cost != null ? money(a.cost) : "\u2013"}</div></div>
                  <div><div class="help">Date purchased</div><div>${fmtDate(a.date_purchased) || "\u2013"}</div></div>
                  ${a.serial_number ? `<div><div class="help">Serial number</div><div class="mono">${escapeHtml(a.serial_number)}</div></div>` : ""}
                </div>
                ${a.notes ? `<div style="margin-top:8px"><div class="help">Notes</div><div>${escapeHtml(a.notes)}</div></div>` : ""}
              </div>
            </div>
          </div>

          <!-- ------------------------------------------------- Asset Status -->
          <div id="tabpanel-status" class="asset-tabpanel" style="display:none">
            ${warning}
            <div class="status-dashboard">
              <div class="status-card main">
                <div class="help">Current status</div>
                <div style="margin-top:6px">
                  <span class="pill ${STATUS_CLASS[a.status] || 'ok'}" style="font-size:13px">${escapeHtml(a.status)}</span>
                </div>
                ${a.status_note ? `<div style="margin-top:8px">${escapeHtml(a.status_note)}</div>` : ""}
              </div>
              <div class="status-card"><div class="status-label">Status age</div><div class="status-value">${statusAge || "\u2013"}</div></div>
              <div class="status-card"><div class="status-label">Changed by</div><div class="status-value">${escapeHtml(a.status_updated_by || "\u2013")}</div></div>
              <div class="status-card"><div class="status-label">Previous status</div><div class="status-value">${escapeHtml(a.previous_status || "\u2013")}</div></div>
              <div class="status-card"><div class="status-label">Changed on</div><div class="status-value">${a.status_updated_at ? new Date(a.status_updated_at + "Z").toLocaleString() : "\u2013"}</div></div>
              <div class="status-card"><div class="status-label">Total changes</div><div class="status-value">${a.status_change_count}</div></div>
            </div>

            <h4 style="margin:16px 0 6px;font-family:var(--display)">Status timeline (${a.status_history.length})</h4>
            <div class="tablewrap">

            </div>

          <!-- ------------------------------------------ Activity / Check-ins -->
          <div id="tabpanel-activity" class="asset-tabpanel" style="display:none">
            ${custodyBanner(a)}
            ${remindersSection(a)}

              <span class="help">${scans.length} check-in${scans.length === 1 ? "" : "s"}</span>
            </div>
            <div class="tablewrap">
              <table>
                <thead><tr><th>When</th><th>Type</th><th>By</th><th>Details</th><th>Notes</th><th>Location</th></tr></thead>
                <tbody>${a.history.length === 0
                  ? `<tr><td colspan="6" class="empty">No activity yet.</td></tr>`
                  : a.history.map(historyRow).join("")}</tbody>
              </table>
            </div>
          </div>

        </div>
      </div>
    </div>`);
}

  try {
    await api("/settings", { method: "PUT", body: {
      base_url: document.getElementById("s_base").value,

    closeModal(); alert("Saved.");
