          <div class="help" style="margin-top:6px">Known Frore departments fill their code in automatically.</div>
        </div>
        <footer><button class="btn" onclick="closeModal()">Close</button></footer>
      </div>
    </div>`);
}
async function addDept() {
  const name = document.getElementById("newDept").value.trim();
  const code = document.getElementById("newDeptCode").value.trim();
  if (!name) return;
  try { await api("/departments", { method: "POST", body: { name, code } });
    DEPARTMENTS = await api("/departments"); openDepartments(); }
  catch (e) { alert(e.message); }
}
async function saveDeptCode(id, code) {
  try {
    await api(`/departments/${id}`, { method: "PUT", body: { code } });
    DEPARTMENTS = await api("/departments");
    const el = document.getElementById("dc_" + id);
    if (el) { const d = DEPARTMENTS.find(x => x.id === id); el.value = d ? (d.code || "") : code; }
  } catch (e) { alert(e.message); }
}
async function deleteDept(id) {
  if (!confirm("Delete this department? Assets keep their other info, they just lose this department.")) return;
  await api(`/departments/${id}`, { method: "DELETE" });
  DEPARTMENTS = await api("/departments"); openDepartments();
}


/* --------------------------------------------------------------- owners */
async function openOwners() {
  const owners = await api("/owners");
  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:520px">
        <header><h3>Owners</h3><button class="x" onclick="closeModal()">&times;</button></header>
        <div class="body">
          <table><thead><tr><th>Name</th><th class="num">Assets</th><th></th></tr></thead>
            <tbody>${owners.length === 0
              ? `<tr><td colspan="3" class="empty">None yet. Add frequently used owners below.</td></tr>`
              : owners.map(o => `<tr><td>${escapeHtml(o.name)}</td><td class="num">${o.asset_count}</td>
                  <td><button class="btn small danger" onclick="deleteOwner('${encodeURIComponent(o.name)}')">Delete</button></td></tr>`).join("")}
            </tbody></table>
          <div class="row" style="margin-top:12px">
            <input id="newOwner" placeholder="New owner name" style="flex:1" autocomplete="off" />
            <button class="btn primary" onclick="addOwner()">Add</button>
          </div>
          <div class="help">Owners added here appear as suggestions when adding/editing assets. You can still type any owner manually.</div>
        </div>
        <footer><button class="btn" onclick="closeModal()">Close</button></footer>
      </div>
    </div>`);
}
async function addOwner() {
  const name = document.getElementById("newOwner").value.trim();
  if (!name) return;
  try {
    await api("/owners", { method: "POST", body: { name } });
    OWNERS = await api("/owners");
    openOwners();
  } catch (e) { alert(e.message); }
}
async function deleteOwner(encodedName) {
  const name = decodeURIComponent(encodedName);
  if (!confirm("Delete this owner from the pick list? Existing assets keep their owner text.")) return;
  try {
    await api(`/owners/${encodedName}`, { method: "DELETE" });
    OWNERS = await api("/owners");
    openOwners();
  } catch (e) { alert(e.message); }
}

/* ------------------------------------------------- bulk edit (many assets) */
// Each field is opt-in via its own checkbox. Without that there's no way to
// tell "leave this alone" from "clear this" - an empty box would silently wipe
// the owner on every selected asset.
function bulkEditDialog() {
  const n = SELECTED.size;
  if (!n) return;
  const row = (key, label, control) => `
    <div class="bulk-edit-row">
      <label class="row" style="gap:8px;align-items:center;min-width:150px">
        <input type="checkbox" id="be_on_${key}" onchange="bulkEditToggle('${key}')" />
        <span>${label}</span></label>
      <div style="flex:1">${control}</div>
    </div>`;
  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:540px">
        <header><h3>Edit ${n} asset${n === 1 ? "" : "s"}</h3><button class="x" onclick="closeModal()">&times;</button></header>
        <div class="body">
          <div class="help" style="margin-bottom:12px">Tick a field to change it on all ${n} selected asset${n === 1 ? "" : "s"}.
            Anything left unticked stays as it is. Ticking a field and leaving it blank clears it.</div>
          ${row("department_id", "Department", `<select id="be_department_id" disabled>
              <option value="">(none)</option>
              ${DEPARTMENTS.map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join("")}
            </select>`)}
          ${row("owner", "Owner", `<select id="be_owner" disabled>
              <option value="">(none)</option>
              ${OWNERS.map(o => { const nm = (typeof o === "string" ? o : o.name) || "";
                return `<option value="${escapeHtml(nm)}">${escapeHtml(nm)}</option>`; }).join("")}
            </select>`)}
          ${row("location", "Location", `<select id="be_location" disabled>${locationOptions("")}</select>`)}
          ${row("asset_class", "Class", `<select id="be_asset_class" disabled>${classOptions("")}</select>`)}
          ${row("vendor", "Vendor", `<input id="be_vendor" disabled autocomplete="off" placeholder="Vendor" />`)}
          ${row("notes", "Notes", `<input id="be_notes" disabled autocomplete="off" placeholder="Notes (replaces existing)" />`)}
          <div id="be_err" class="help" style="color:var(--red);margin-top:10px"></div>
        </div>
        <footer>
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn primary" id="be_save" onclick="bulkEditSave()">Apply to ${n}</button>
        </footer>
      </div>
    </div>`);
}
function bulkEditToggle(key) {
  const on = document.getElementById(`be_on_${key}`).checked;
  const input = document.getElementById(`be_${key}`);
  input.disabled = !on;
  if (on) input.focus();
}
const BULK_EDIT_FIELDS = ["department_id", "owner", "location", "asset_class", "vendor", "notes"];
async function bulkEditSave() {
  const err = document.getElementById("be_err");
  err.textContent = "";
  const fields = {};
  BULK_EDIT_FIELDS.forEach(k => {
    if (document.getElementById(`be_on_${k}`).checked) {
      fields[k] = document.getElementById(`be_${k}`).value;
    }
  });
  if (!Object.keys(fields).length) { err.textContent = "Tick at least one field to change."; return; }
  const ids = [...SELECTED];
  const cleared = Object.entries(fields).filter(([, v]) => !v).map(([k]) => k);
  if (cleared.length && !confirm(
      `This will clear ${cleared.join(", ")} on ${ids.length} asset${ids.length === 1 ? "" : "s"}. Continue?`)) return;
  const btn = document.getElementById("be_save");
  btn.disabled = true; btn.textContent = "Saving\u2026";
  try {
    const r = await api("/assets/bulk-edit", { method: "POST", body: { ids, fields } });
    closeModal();
    clearSelection();
    await loadAssets();
    renderDashboard();
    alert(`Updated ${r.updated} asset${r.updated === 1 ? "" : "s"}.`);
  } catch (e) {
    btn.disabled = false; btn.textContent = `Apply to ${ids.length}`;
    err.textContent = e.message || "Couldn't save.";
  }
}

/* ------------------------------------------------- locations */
async function reloadLocations() {
  const data = await api("/locations");
  LOCATION_TREE = data.tree || []; LOCATION_FLAT = data.flat || [];
  LOCATIONS = LOCATION_FLAT.map(l => l.name);
}
async function openLocations() {
  closeSettingsMenu();
  await reloadLocations();
  const parentRow = p => `
    <div class="loc-parent">
      <div class="row" style="justify-content:space-between;align-items:center">
        <input value="${escapeHtml(p.name)}" style="flex:1;font-weight:600" onchange="saveLocation(${p.id}, this.value)" />
        <button class="btn small danger" onclick="deleteLocation(${p.id})" title="Delete this location and its sub-locations">Delete</button>
      </div>
      <div class="loc-children">
        ${(p.children || []).map(c => `
          <div class="row" style="justify-content:space-between;align-items:center;margin-top:4px">
            <input value="${escapeHtml(c.name)}" style="flex:1;margin-left:16px" onchange="saveLocation(${c.id}, this.value)" />
            <button class="btn small danger" onclick="deleteLocation(${c.id})">Delete</button>
          </div>`).join("")}
        <div class="row" style="margin-top:4px;margin-left:16px">
          <input id="newchild_${p.id}" placeholder="Add sub-location&hellip;" style="flex:1" autocomplete="off" />
          <button class="btn small" onclick="addChildLocation(${p.id})">+ Sub</button>
        </div>
      </div>
    </div>`;
  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:520px">
        <header><h3>Locations</h3><button class="x" onclick="closeModal()">&times;</button></header>
        <div class="body">
          <div class="help" style="margin-bottom:10px">Locations can have sub-locations. Renaming one
            updates every asset already using it. Assets keep any free-text location that isn't on this list.</div>
          ${LOCATION_TREE.length === 0 ? `<div class="empty">None yet — add one below.</div>` : LOCATION_TREE.map(parentRow).join("")}
          <div class="row" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
            <input id="newLoc" placeholder="New top-level location" style="flex:1" autocomplete="off"
                   onkeydown="if(event.key==='Enter')addLocation()" />
            <button class="btn primary" onclick="addLocation()">Add</button>
          </div>
        </div>
        <footer><button class="btn" onclick="closeModal()">Close</button></footer>
      </div>
    </div>`);
}
async function addLocation() {
  const name = document.getElementById("newLoc").value.trim();
  if (!name) return;
  try { await api("/locations", { method: "POST", body: { name } }); await openLocations(); }
  catch (e) { alert(e.message); }
}
async function addChildLocation(parentId) {
  const name = document.getElementById(`newchild_${parentId}`).value.trim();
  if (!name) return;
  try { await api("/locations", { method: "POST", body: { name, parent_id: parentId } }); await openLocations(); }
  catch (e) { alert(e.message); }
}
async function saveLocation(id, name) {
  try { await api(`/locations/${id}`, { method: "PUT", body: { name } });
    await reloadLocations(); await loadAssets(); }
  catch (e) { alert(e.message); await openLocations(); }
}
async function deleteLocation(id) {
  if (!confirm("Delete this location? Any sub-locations under it are removed too.\n\nAssets keep their current location text.")) return;
  try { await api(`/locations/${id}`, { method: "DELETE" }); await openLocations(); }
  catch (e) { alert(e.message); }
}

/* --------------------------------------------------------------- classes */
async function openClasses() {
  closeSettingsMenu();
  const classes = await api("/classes");
  CLASSES = classes.map(c => c.name);
  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:480px">
        <header><h3>Classes</h3><button class="x" onclick="closeModal()">&times;</button></header>
        <div class="body">
          <div class="help" style="margin-bottom:10px">The list of classes available when adding or editing
            an asset. Renaming one updates every asset already using it.</div>
          <table><thead><tr><th>Name</th><th></th></tr></thead>
            <tbody>${classes.length === 0
              ? `<tr><td colspan="2" class="empty">None yet — add one below.</td></tr>`
              : classes.map(c => `<tr>
                  <td><input id="cls_${c.id}" value="${escapeHtml(c.name)}" style="width:100%" onchange="saveClass(${c.id}, this.value)" /></td>
                  <td><button class="btn small danger" onclick="deleteClass(${c.id})">Delete</button></td></tr>`).join("")}
            </tbody></table>
          <div class="row" style="margin-top:12px">
            <input id="newCls" placeholder="New class name" style="flex:1" autocomplete="off"
                   onkeydown="if(event.key==='Enter')addClass()" />
            <button class="btn primary" onclick="addClass()">Add</button>
          </div>
        </div>
        <footer><button class="btn" onclick="closeModal()">Close</button></footer>
      </div>
    </div>`);
}
async function addClass() {
  const name = document.getElementById("newCls").value.trim();
  if (!name) return;
  try { await api("/classes", { method: "POST", body: { name } }); await openClasses(); }
  catch (e) { alert(e.message); }
}
async function saveClass(id, name) {
  try { await api(`/classes/${id}`, { method: "PUT", body: { name } });
    CLASSES = (await api("/classes")).map(c => c.name); await loadAssets(); }
  catch (e) { alert(e.message); await openClasses(); }
}
async function deleteClass(id) {
  if (!confirm("Delete this class? Existing assets keep their current class text.")) return;
  try { await api(`/classes/${id}`, { method: "DELETE" }); await openClasses(); }
  catch (e) { alert(e.message); }
}

  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:380px">
        <header><h3>Admin login</h3><button class="x" onclick="closeModal()">&times;</button></header>
        <div class="body">
          <div class="help" style="margin-bottom:12px">Enter the admin password to unlock departments,
            settings, and permanent deletion. You're already signed in to Frore for everything else.</div>
          <label class="f"><span>Admin password</span>
            <input id="adminPw" type="password" autofocus

          <div id="adminErr" style="color:var(--red);font-size:13px;margin-top:8px"></div>
        </div>
        <footer>
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn primary" onclick="adminLogin()">Unlock</button>
